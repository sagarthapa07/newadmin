<!-- photo-editor.component.html -->

<!-- Upload -->
<div class="upload-area">
  <label class="upload-btn">
    📁 Choose Image
    <input type="file" accept="image/*" (change)="fileChange($event)" hidden />
  </label>
  <span class="file-name">{{ fileName || 'No file chosen' }}</span>
</div>

<!-- Modal -->
@if (showEditor) {
  <div class="modal-overlay" (click)="overlayClick($event)">
    <div class="modal">

      <div class="modal-header">Photo Editor</div>

      <!-- Canvas -->
      <div class="canvas-wrap" #canvasWrap
        (wheel)="onWheel($event)"
        (mousedown)="onCanvasMD($event)">

        <!-- Image -->
        <div class="img-layer" #imgLayer
          [style.transform]="imgLayerStyle()">
          <img #editorImg [src]="imageSrc" draggable="false"
            [style.transform]="imgStyle()" />
        </div>

        <!-- ★ CROP FRAME ★ -->
        <div class="crop-frame"
          [style.left.px]="crop.x"
          [style.top.px]="crop.y"
          [style.width.px]="crop.w"
          [style.height.px]="crop.h"
          (mousedown)="onCropMD($event)">

          <!-- Grid lines -->
          <div class="gl h" style="top:33.33%"></div>
          <div class="gl h" style="top:66.66%"></div>
          <div class="gl v" style="left:33.33%"></div>
          <div class="gl v" style="left:66.66%"></div>

          <!-- 8 resize handles -->
          <div class="rh tl" (mousedown)="onHandleMD($event,'tl')"></div>
          <div class="rh tc" (mousedown)="onHandleMD($event,'tc')"></div>
          <div class="rh tr" (mousedown)="onHandleMD($event,'tr')"></div>
          <div class="rh ml" (mousedown)="onHandleMD($event,'ml')"></div>
          <div class="rh mr" (mousedown)="onHandleMD($event,'mr')"></div>
          <div class="rh bl" (mousedown)="onHandleMD($event,'bl')"></div>
          <div class="rh bc" (mousedown)="onHandleMD($event,'bc')"></div>
          <div class="rh br" (mousedown)="onHandleMD($event,'br')"></div>

          <!-- Size label -->
          <div class="crop-label">
            {{ crop.w | number:'1.0-0' }} × {{ crop.h | number:'1.0-0' }}
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <button class="tbtn" (click)="doZoom(-0.1)" title="Zoom Out">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
        <span class="ztxt">{{ (scale*100).toFixed(0) }}%</span>
        <button class="tbtn" (click)="doZoom(0.1)" title="Zoom In">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
        <div class="div"></div>
        <button class="tbtn" (click)="doRotate(-90)" title="Rotate Left">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/>
          </svg>
        </button>
        <button class="tbtn" (click)="doRotate(90)" title="Rotate Right">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4"/>
          </svg>
        </button>
        <div class="div"></div>
        <button class="tbtn" (click)="doFlip('h')" title="Flip H">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
        <button class="tbtn" (click)="doFlip('v')" title="Flip V">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 7 19 3 15 7"/><path d="M13 21H11a4 4 0 0 1-4-4V3"/>
            <polyline points="1 17 5 21 9 17"/><path d="M11 3h2a4 4 0 0 1 4 4v14"/>
          </svg>
        </button>
        <div class="div"></div>
        <button class="tbtn" (click)="doReset(); initCropBox()" title="Reset">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
        </button>
      </div>

      <div class="modal-footer">
        <button class="btn-close" (click)="closeEditor()">Close</button>
        <button class="btn-apply" (click)="applyEdit()">Apply</button>
      </div>
    </div>
  </div>
}

<!-- Output -->
@if (outputSrc) {
  <div class="output">
    <img [src]="outputSrc" alt="output" />
  </div>
}
