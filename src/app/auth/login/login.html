<section class="login-page">
  <app-alert-message
    *ngIf="successMessage"
    type="success"
    [message]="successMessage"
    (close)="successMessage = ''"
  >
  </app-alert-message>

  <app-alert-message
    *ngIf="errorMessage"
    type="error"
    [message]="errorMessage"
    (close)="errorMessage = ''"
  >
  </app-alert-message>

  <nav class="navbar">
    <img src="../../../assets/logo (3).png" alt="GrantsforUS" class="navbar-brand" />
  </nav>

  <div class="login-right">
    <div class="login-card">
      <div class="login-logo">
        <img src="../../../assets/logo-icon1.png" alt="" />
      </div>

      <h3 class="login-title">Login to your account</h3>
      <p class="login-subtitle">Enter your credentials to continue</p>
      <div class="title-underline mx-auto"></div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
        novalidate
        class="login-form"
      >
        <div class="form-group">
          <label for="name">User Name</label>
          <div class="input-with-icon">
            <i class="bi bi-person"></i>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Enter your user name"
              formControlName="name"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <i class="bi bi-lock"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              formControlName="password"
            />
            <i
              class="bi toggle-eye"
              [class.bi-eye]="!showPassword"
              [class.bi-eye-slash]="showPassword"
              (click)="togglePasswordVisibility()"
              role="button"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            ></i>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-check">
            <input type="checkbox" formControlName="rememberMe" />
            Remember me
          </label>
          <a class="forgot-link" (click)="goToForgotPassword()">Forgot password?</a>
        </div>

        <button class="button button-primary login-btn" type="submit" [disabled]="loading">
          <ng-container *ngIf="!loading"> Login <i class="bi bi-arrow-right"></i> </ng-container>
          <ng-container *ngIf="loading">
            <span class="spinner-border spinner-border-sm"></span> Logging in...
          </ng-container>
        </button>
        <p class="help-text">
          Don't have access yet?
          <a href="https://release.grantsforus.app/request-account" target="_blank" rel="noopener">
            Request Account
          </a>
        </p>
      </form>
    </div>
  </div>
</section>
