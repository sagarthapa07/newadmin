<app-header></app-header>
<section class="header-section">
  <div class="edit-invoice-container">
    <!-- LEFT -->

    <div class="invoice-left">
      <div class="invoice-tabs">
        <button
          [class.active]="activeTab === 'invoice-details'"
          (click)="activeTab = 'invoice-details'"
        >
          Invoice details
        </button>

        <button [class.active]="activeTab === 'discount'" (click)="activeTab = 'discount'">
          Discount Coupons
        </button>

        <button [class.active]="activeTab === 'invoice'" (click)="activeTab = 'invoice'">
          Invoice Detail
        </button>

        <button [class.active]="activeTab === 'misc'" (click)="activeTab = 'misc'">
          Miscellaneous Charges
        </button>

        <button [class.active]="activeTab === 'transaction'" (click)="activeTab = 'transaction'">
          Transactions Detail
        </button>
      </div>

      <form [formGroup]="invoiceForm">
        @if (activeTab === 'invoice-details') {
          <div class="form-row">
            <label>Selected Plan:</label>

            <div class="field-group single">
              <select formControlName="plan">
                @for (plan of plans; track plan.index) {
                  <option [value]="plan.name">
                    {{ plan.name }}
                  </option>
                }
              </select>
            </div>
          </div>

          <div class="form-row">
            <label>Plan Amount:</label>

            <div class="field-group amount-row">
              <input type="text" formControlName="planAmount" />
              <span>USD</span>
            </div>
          </div>

          <div class="form-row">
            <label>Plan Activation Date:</label>

            <div class="field-group single">
              <input type="date" formControlName="planActivationDate" />
            </div>
          </div>

          <div class="form-row">
            <label>Plan Duration:</label>

            <div class="field-group">
              <input type="number" formControlName="planDuration" />

              <select formControlName="planDurationUnit">
                <option value="Year" selected>Select</option>
                <option value="Year">Year</option>
                <option value="Month">Month</option>
                <option value="day">Day</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <label>Plan Expiry Date:</label>

            <div class="field-group single">
              <input type="date" formControlName="planExpiryDate" />
            </div>
          </div>

          <div class="form-row">
            <label>Extended Expiry Date:</label>

            <div class="field-group single">
              <input type="date" formControlName="extendedExpiryDate" />
            </div>
          </div>

          <div class="form-row">
            <label>Validity Remark:</label>

            <div class="field-group single">
              <textarea rows="4" formControlName="validityRemark"></textarea>
            </div>
          </div>
        }

        @if (activeTab === 'invoice') {
          <div class="form-row">
            <label>Invoice Number</label>
            <input type="text" formControlName="invoiceNumber" />
          </div>

          <div class="form-row">
            <label>Invoice Status</label>
            <input type="text" formControlName="invoiceStatus" />
          </div>

          <div class="form-row">
            <label>Net Amount</label>
            <input type="text" formControlName="netInvoiceAmount" />
          </div>
        }

        @if (activeTab === 'transaction') {
          <div class="form-row">
            <label>Payment Mode</label>

            <input type="text" formControlName="paymentMode" />
          </div>

          <div class="form-row">
            <label>Payment Id</label>

            <input type="text" formControlName="paymentId" />
          </div>

          <div class="form-row">
            <label>Transaction Date</label>

            <input type="date" formControlName="transactionDate" />
          </div>

          <div class="form-row">
            <label>Payer Email</label>
            <input type="text" formControlName="payerEmail" />
          </div>

          <div class="form-row">
            <label>Transaction Id</label>
            <input type="text" formControlName="transactionId" />
          </div>
        }

        <button class="btn btn-primary" type="button" (click)="saveInvoice()">Save</button>
      </form>
    </div>

    <!-- RIGHT -->

    <div class="member-sidebar">
      <form [formGroup]="memberForm">
        <!-- Member Name -->
        <div class="form-row">
          <label>Member's name:</label>

          <div class="field-group">
            <input type="text" formControlName="firstName" />
            <input type="text" formControlName="lastName" />
          </div>
        </div>

        <!-- Location -->
        <div class="form-row">
          <label>Location:</label>

          <div class="field-group">
            <select formControlName="country">
              @for (c of country; track $index) {
                <option [value]="c.country">{{ c.country }}</option>
              }
            </select>

            <select formControlName="state">
              @for (state of states; track $index) {
                <option [value]="state.stateName">{{ state.stateName }}</option>
              }
            </select>

            <input type="text" formControlName="zipCode" />
            <input type="text" formControlName="city" />
          </div>
        </div>

        <!-- Address -->
        <div class="form-row">
          <label>Address</label>
          <textarea formControlName="billingAddress" rows="1"></textarea>
        </div>

        <!-- Remark -->
        <div class="form-row">
          <label>Remark</label>
          <textarea formControlName="remarks" rows="1"></textarea>
        </div>

        <!-- Plan -->
        <div class="form-row">
          <label>Current Plan</label>
          <select formControlName="plan">
            @for (plan of plans; track plan.index) {
              <option [value]="plan.name">
                {{ plan.name }}
              </option>
            }
          </select>
        </div>

        <!-- Email -->
        <div class="form-row">
          <label>Email</label>
          <input type="text" formControlName="email" />
        </div>

        <!-- Password -->
        <div class="form-row">
          <label>Password</label>
          <input type="text" formControlName="password" />
        </div>

        <!-- Phone -->
        <div class="form-row">
          <label>Phone</label>
          <input type="text" formControlName="contactNo" />
        </div>

        <!-- Status -->
        <div class="form-row">
          <label>Status</label>
          <input type="text" formControlName="memberStatus" />
        </div>

        <!-- Registration Date -->
        <div class="form-row">
          <label>Registration Date</label>
          <input type="date" formControlName="registrationDate" />
        </div>

        <!-- Activation Date -->
        <div class="form-row">
          <label>Activation Date</label>
          <input type="date" formControlName="activationDate" />
        </div>

        <button type="button" class="btn btn-primary" (click)="saveMember()">Save</button>
      </form>
    </div>
  </div>
</section>
