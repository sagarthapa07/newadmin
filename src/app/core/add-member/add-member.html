<app-header></app-header>
<app-alert-message
  *ngIf="successMessage"
  [type]="'success'"
  [message]="successMessage"
  (close)="successMessage = ''"
></app-alert-message>

<app-alert-message
  *ngIf="errorMessage"
  [type]="'error'"
  [message]="errorMessage"
  (close)="errorMessage = ''"
></app-alert-message>

<section class="page-wrapper header-section">
  <div class="page-intro">
    <div class="intro-left">
      <div class="intro-icon">
        <i class="bi bi-person-vcard"></i>
      </div>
      <div>
        <h2 class="intro-title">Add New Member</h2>
        <p class="intro-subtitle">Fill in the details below to create a new premium member account.</p>
      </div>
    </div>
  </div>

  <div class="card-box">
    <form [formGroup]="memberForm">
    <div class="member-grid">
      <!-- LEFT: Personal Details -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-icon"><i class="bi bi-person"></i></div>
          <h5>Personal Details</h5>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-person"></i></span> Member's Name
          </div>
          <div class="double-input">
            <div class="input-group-block">
              <input
                type="text"
                class="form-control"
                formControlName="firstName"
                placeholder="First Name"
              />

            </div>
            <div class="input-group-block">
              <input
                type="text"
                class="form-control"
                formControlName="lastName"
                placeholder="Last Name"
              />

            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-geo-alt"></i></span> Location
          </div>
          <div class="double-input">
            <div class="select-wrapper">
              <select class="form-control state-dropdown" formControlName="country">
                <option value="">Select</option>
                <option value="United States">United State</option>
              </select>
              <i class="bi bi-chevron-down"></i>
            </div>
            <div class="select-wrapper">
              <select class="form-control state-dropdown" formControlName="state">
                <option value="">Select</option>
                @for (item of states; track item.stateID) {
                  <option [value]="item.stateName">{{ item.stateName }}</option>
                }
              </select>
              <i class="bi bi-chevron-down"></i>
            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="double-input">
            <div class="input-group-icon">
              <i class="bi bi-mailbox"></i>
              <input
                type="text"
                class="form-control"
                formControlName="zipCode"
                placeholder="Zip Code"
              />
            </div>
            <div class="input-group-icon">
              <i class="bi bi-building"></i>
              <input type="text" class="form-control" formControlName="city" placeholder="City" />
            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-house"></i></span> Address
          </div>
          <input type="text" class="form-control" formControlName="billingAddress" placeholder="Address"/>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-chat-left-text"></i></span> Remark
          </div>
          <input type="text" class="form-control" formControlName="remarks" placeholder="Remark"/>
        </div>
      </div>

      <!-- RIGHT: Account Details -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-icon"><i class="bi bi-shield-check"></i></div>
          <h5>Account Details</h5>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-calendar2-check"></i></span> Current Plan
          </div>
          <div class="select-wrapper full">
            <select class="form-control state-dropdown" formControlName="plan">
              <option value="">Select</option>
              @for (item of plans; track item.index) {
                <option [value]="item.name">{{ item.name }}</option>
              }
            </select>
            <i class="bi bi-chevron-down"></i>
          </div>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-envelope"></i></span> Email
          </div>
          <input type="text" class="form-control" placeholder="Email" formControlName="email" />
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-lock"></i></span> Password
          </div>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="Password"
            />
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              (click)="togglePassword()"
            ></i>
          </div>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-telephone"></i></span> Phone
          </div>
          <input type="text" class="form-control" formControlName="contactNo" placeholder="Phone No."/>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-toggle2-on"></i></span> Status
          </div>
          <div class="select-wrapper full">
            <select class="form-control state-dropdown" formControlName="memberStatus">
              <option value="">Select</option>
              <option value="NEW">New</option>
              <option value="ACTIVE">Active</option>
              <option value="EXPIRED">Expired</option>
              <option value="BLOCKED">Blocked</option>
            </select>
            <i class="bi bi-chevron-down"></i>
          </div>
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-calendar-event"></i></span> Registration Date
          </div>
          <input type="date" class="form-control" formControlName="registrationDate" />
        </div>

        <div class="field-row">
          <div class="field-label">
            <span class="row-icon"><i class="bi bi-calendar-check"></i></span> Activation Date
          </div>
          <input type="date" class="form-control" formControlName="activationDate" />
        </div>
      </div>
    </div>

      <div class="buttons d-flex justify-content-end">
        <button type="button" class="button button-secondary" (click)="onCancel()">
          <span>Cancel</span>
        </button>
        <button type="button" class="button button-primary" [disabled]="isSaving" (click)="onSave()">
          @if (!isSaving) {
<i class="bi bi-floppy"></i>
          }
          <span>{{ isSaving ? 'Saving...' : 'Save Member' }}</span>
        </button>
      </div>
    </form>
  </div>
</section>
