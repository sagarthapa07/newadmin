<app-header></app-header>
<app-alert-message
  [type]="alertType"
  [message]="alertMessage"
  (close)="onAlertClose()"
></app-alert-message>
<section class="header-section">
  <div class="header-sec">
    <div class="header-row">
      <!-- LEFT COLUMN -->
      <div class="header-left">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass icons" (click)="onSearch()"></i>

          <div class="search-wrapper">
            <input
              type="text"
              placeholder="Search pending grants"
              [(ngModel)]="searchText"
              (keyup.enter)="onSearch()"
              (input)="onInputChange()"
            />
          </div>
        </div>

        <button class="button button-primary" (click)="onSearch()">
          <span>Search</span>
        </button>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="header-right">
        <div class="date-range-wrapper position-relative">
          <div class="input-group range-input" (click)="toggle()">
            <input
              class="form-control"
              readonly
              [value]="displayValue"
              placeholder="Select date range"
              (click)="toggle()"
            />

            <button type="button" class="clear-btn" (click)="clearDateFilter($event)">
              <i class="bi bi-x-lg"></i>
            </button>

            <button class="btn calendar-btn" type="button" (click)="picker.applySelection()">
              <i class="bi bi-calendar3"></i>
            </button>
          </div>

          @if (open) {
            <div class="calendar-popup">
              <app-date-picker
                #picker
                [fromDate]="fromDate"
                [toDate]="toDate"
                (dateSelected)="onDateChange($event)"
              ></app-date-picker>
            </div>
          }
        </div>

        <div>
          <button class="button button-secondary" (click)="exportPendingGrants()">
            <i class="bi bi-file-arrow-down"></i>
            <span>Export</span>
          </button>
        </div>

        <div>
          <button class="button button-primary" routerLink="/calendar-opportunity/add-new">
            <i class="fa-solid fa-plus"></i>
            Add New
          </button>
        </div>
      </div>
    </div>
  </div>

  <br />

  <!-- TABLE -->
  <app-table-column
    [columns]="columns"
    [data]="grants"
    [isLoading]="isLoading"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [totalCount]="totalCount"
    (pageChange)="changePage($event)"
    (pageSizeChange)="onPageSizeChangeHandler($event)"
  >
    <ng-template #cellTemplate let-item let-col="col">
      @switch (col.key) {
        @case ('lastUpdated') {
          {{ item.lastUpdated | date: 'dd MMM yyyy, hh:mm a' }}
        }
        @case ('type') {
          <span class="status" [ngClass]="item.grantId ? 'status-published' : 'status-draft'">
            {{ item.grantId ? 'Editing existing' : 'New opportunity' }}
          </span>
        }
        @case ('actions') {
          <div class="action-icons">
            <button class="btn" (click)="resumeDraft(item)">
              Resume <i class="bi bi-arrow-clockwise table-icon-cell"></i>
            </button>
            <button class="btn" (click)="deleteDraft(item)">
              Delete <i class="bi bi-trash table-icon-cell"></i>
            </button>
          </div>
        }
      }
    </ng-template>
  </app-table-column>
</section>
