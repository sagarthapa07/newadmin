<app-header></app-header>

<section class="header-section">
  @if (errorMessage) {
    <app-alert-message
      [type]="'error'"
      [message]="errorMessage"
      (close)="errorMessage = ''">
    </app-alert-message>
  }

  <div class="page-header">
    <h4 class="page-title">Calendar and Premium Newsletter (Add/Edit)</h4>

    <div class="nav-btn">
      @for (item of menuItems; track item.id) {
        <button
          class="btn"
          [class.active]="activeItem === item.id"
          [class.locked]="isTabLocked(item.id)"
          [attr.title]="isTabLocked(item.id) ? 'Save this opportunity first' : null"
          (click)="setActive(item.id)">
          {{ item.label }}
        </button>
      }
    </div>
  </div>

  @if (isLoading) {
    <div class="component-loader">
      <span class="loader-dot"></span>
      Loading data...
    </div>
  }

  @if (activeItem === 1) {
    <app-calendar-details
      [data]="grantData"
      [draftId]="draftId"
      (tabChange)="setActive($event)">
    </app-calendar-details>
  }
</section>
