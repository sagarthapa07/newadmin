<app-header></app-header>

<section class="header-section">
  <div class="heading">
    <span>Member Invoice Search Module</span>
  </div>
  <div class="header-sec">
    <div class="header-row">
      <div class="header-left">
        <div class="search-box">
          <div class="search-wrapper">
            <input
              type="text"
              placeholder="Search"
              [(ngModel)]="searchText"
              (focus)="showSuggestions = true"
              (keyup.enter)="onSearch()"
              (input)="onInputChange()"
            />

            @if (showSuggestions && searchHistory.length) {
              <div class="suggestions">
                @for (item of searchHistory.slice(0, 5); track item) {
                  <div class="suggestion-item" (click)="selectSuggestion(item)">
                    {{ item }}
                  </div>
                }
              </div>
            }
          </div>
        </div>

        <button class="filter-btn" (click)="onSearch()">Search</button>
      </div>
      <div class="header-right">
        <div>
          <button class="btn filter-btn" (click)="exportSelectedInvoices()">
            <i class="bi bi-file-arrow-down"></i>
            <span>Export</span>
          </button>
        </div>

        <div style="margin-right: 20px">
          <button class="btn filter-btn w-100" routerLink="/calendar-opportunity/add-new">
            <i class="fa-solid fa-plus"></i>
            Add New
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-table-column
    [columns]="columns"
    [data]="members"
    [isLoading]="isLoading"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [totalCount]="totalCount"
    (pageChange)="changePage($event)"
    (pageSizeChange)="onPageSizeChangeHandler($event)"
  >
    <ng-template #cellTemplate let-item let-col="col">
      @switch (col.key) {
        @case ('invoiceNumber') {
          <a href="javascript:void(0)" (click)="openInvoice(item.memberId, item.invoiceId)">
            {{ item.invoiceNumber }}
          </a>
        }
        @case ('invoiceDate') {
          {{ item.invoiceDate | date: 'yyyy-MMM-dd' }}
        }
      }
    </ng-template>
  </app-table-column>
</section>
