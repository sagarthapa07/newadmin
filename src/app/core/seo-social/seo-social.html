<section class="ss-page">
  <app-alert-message [message]="toastMessage" [type]="toastType" (close)="toastMessage = ''">
  </app-alert-message>

  <form [formGroup]="opportunityForm" (ngSubmit)="onSave()">
    <div class="ss-card">
      <!-- HEADER -->
      <div class="focus-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <h5 class="mb-1"><i class="bi bi-globe2 me-2"></i>SEO & Social Media</h5>
          <p class="sub-text mb-0">
            Manage SEO information and social media references for your opportunity.
          </p>
        </div>
      </div>

      <!-- BODY -->
      <div class="ss-body">
        <div class="row g-0">
          <!-- LEFT - SEO DETAILS -->
          <div class="col-lg-6 col-12 ss-col ss-col-left">
            <h6 class="ss-section-title">SEO DETAILS</h6>

            <div class="ss-field">
              <span class="ss-field-icon"><i class="bi bi-link-45deg"></i></span>
              <div class="ss-field-body">
                <label>Friendly URL <span class="ss-required">*</span></label>
                <input
                  type="url"
                  class="form-control"
                  formControlName="linkUrl"
                  placeholder="Enter friendly URL"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon"><i class="bi bi-fonts"></i></span>
              <div class="ss-field-body">
                <label>Meta Title <span class="ss-required">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="M-title"
                  placeholder="Enter meta title"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon"><i class="bi bi-person"></i></span>
              <div class="ss-field-body">
                <label>Meta Author</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="M-author"
                  placeholder="Enter meta author"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon"><i class="bi bi-hash"></i></span>
              <div class="ss-field-body">
                <label>Meta Keywords</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="M-keywords"
                  placeholder="Enter meta keywords"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon"><i class="bi bi-pencil-square"></i></span>
              <div class="ss-field-body">
                <label>Meta Description</label>
                <textarea
                  rows="3"
                  class="form-control"
                  formControlName="shortInfo"
                  placeholder="Enter meta description"
                ></textarea>
              </div>
            </div>
          </div>

          <!-- RIGHT - SOCIAL REFERENCES -->
          <div class="col-lg-6 col-12 ss-col ss-col-right">
            <h6 class="ss-section-title">SOCIAL REFERENCES</h6>

            <div class="ss-field">
              <span class="ss-field-icon ss-brand-fb"><i class="bi bi-facebook"></i></span>
              <div class="ss-field-body">
                <label>Facebook Handler <i class="bi bi-info-circle ss-info"></i></label>
                <input
                  type="url"
                  class="form-control"
                  formControlName="F-Handler"
                  placeholder="https://facebook.com/yourpage"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon ss-brand-tw"><i class="bi bi-twitter"></i></span>
              <div class="ss-field-body">
                <label>Twitter Handler <i class="bi bi-info-circle ss-info"></i></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="T-Handler"
                  placeholder="https://twitter.com/yourprofile"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon ss-brand-gp"><i class="bi bi-google"></i></span>
              <div class="ss-field-body">
                <label>Google Plus Handler <i class="bi bi-info-circle ss-info"></i></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="G-Handler"
                  placeholder="https://plus.google.com/yourprofile"
                />
              </div>
            </div>

            <div class="ss-field">
              <span class="ss-field-icon ss-brand-ig"><i class="bi bi-instagram"></i></span>
              <div class="ss-field-body">
                <label>Instagram Handler <i class="bi bi-info-circle ss-info"></i></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="I-Handler"
                  placeholder="https://instagram.com/yourprofile"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="ss-footer">
        <button type="button" class="button button-danger" (click)="clearAll()">
          <i class="bi bi-trash3"></i> Clear All
        </button>

        <div class="ss-footer-right">
          <button type="button" class="button button-secondary" (click)="goToCounties()">
            <i class="bi bi-skip-backward"></i> Back
          </button>
          <button
            type="button"
            class="button button-secondary btn-save"
            [disabled]="isSaving"
            (click)="onSave()"
          >
            @if (isSaving) {
              <span class="loader-dot"></span> Saving...
            } @else {
              <i class="bi bi-bookmark-check"></i> Save
            }
          </button>
          <button type="button" class="button button-primary" (click)="goToPreview()">
            <i class="bi bi-eye"></i> Preview
          </button>
        </div>
      </div>
    </div>
  </form>
</section>
